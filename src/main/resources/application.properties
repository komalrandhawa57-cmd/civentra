server.port=${SERVER_PORT:8081}
spring.application.name=CIVENTRA

# Oracle Database Connection
civentra.db.url=${CIVENTRA_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
civentra.db.username=${CIVENTRA_DB_USERNAME:CIVENTRA_USER}
civentra.db.password=${CIVENTRA_DB_PASSWORD:civentra2026}
civentra.db.pool.size=${CIVENTRA_DB_POOL_SIZE:10}

# AI Settings
civentra.ai.enabled=${CIVENTRA_AI_ENABLED:false}
civentra.ai.api-key=${CIVENTRA_AI_API_KEY:}
civentra.ai.model=${CIVENTRA_AI_MODEL:gpt-4o-mini}
civentra.ai.endpoint=${CIVENTRA_AI_ENDPOINT:https://api.openai.com/v1/responses}
civentra.ai.timeout-seconds=${CIVENTRA_AI_TIMEOUT_SECONDS:15}

# Storage & Map Settings
civentra.storage.upload-dir=${CIVENTRA_STORAGE_UPLOAD_DIR:${user.home}/.civentra/uploads}
civentra.map.tile-url=${CIVENTRA_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
civentra.map.attribution=${CIVENTRA_MAP_ATTRIBUTION:© OpenStreetMap contributors}

# Vaadin Settings
vaadin.launch-browser=false
vaadin.productionMode=false
server.servlet.session.timeout=30m